<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just One Question ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.3);
    width:90%;
    max-width:550px;
    padding:40px;
    border-radius:25px;
    text-align:center;
    color:white;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:2rem;
    margin-bottom:15px;
}

p{
    font-size:1.2rem;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
    font-weight:bold;
}

.yes{
    background:#ff4d88;
    color:white;
}

.no{
    background:white;
    color:#ff4d88;
}

button:hover{
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

#result{
    margin-top:35px;
    font-size:1.5rem;
    font-weight:bold;
    min-height:40px;
    animation:fade .4s;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}

.heart{
    font-size:60px;
    animation:beat 1s infinite;
    margin-bottom:15px;
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.2);}
}
</style>

</head>
<body>

<div class="container">

<div class="heart">❤️</div>

<h1>A Special Question</h1>

<p><strong>Ariana Panaguiton Bernardo, may you be mine forever?</strong></p>

<div class="buttons">
    <button class="yes" onclick="answerYes()">Yes 💖</button>
    <button class="no" id="noBtn" onclick="answerNo()">No 😢</button>
</div>

<div id="result"></div>

</div>

<script>
const noBtn = document.getElementById("noBtn");

// Yes button
function answerYes() {
    document.getElementById("result").innerHTML =
    "💖 You are mine now forever 💖";
}

// No button
function answerNo() {
    document.getElementById("result").innerHTML =
    "😤 You should be mine forever dapat akin ka lang 😤";
}

// Make the No button run away
noBtn.addEventListener("mouseenter", () => {
    const padding = 20;

    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
    noBtn.style.transition = "0.25s ease";
});

// For mobile devices (touch)
noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();

    const padding = 20;

    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    noBtn.style.position = "fixed";
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
});
</script>
</body>
</html>
