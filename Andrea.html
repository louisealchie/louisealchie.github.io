<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Love Page ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* PASSWORD SCREEN */
#lockScreen{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

#lockScreen input{
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:10px;
    text-align:center;
}

#lockScreen button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#ff4d88;
    color:white;
    cursor:pointer;
}

/* MAIN PAGE */
body{
    overflow:hidden;
}

.main{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    padding:40px;
    border-radius:25px;
    text-align:center;
    color:white;
}

button{
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
}

.yes{
    background:#ff4d88;
    color:white;
}

.no{
    background:white;
    color:#ff4d88;
}

#result{
    margin-top:20px;
    font-size:1.5rem;
}

/* HEARTS */
.falling-heart{
    position:fixed;
    top:-50px;
    animation:fall linear forwards;
}

@keyframes fall{
    100%{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<!-- 🔐 PASSWORD SCREEN -->
<div id="lockScreen">
    <h2>🔐 Enter Secret Password</h2>
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="unlock()">Enter 💖</button>
    <p id="error"></p>
</div>

<!-- 💖 MAIN CONTENT -->
<div class="main" id="mainPage">

    <!-- 🎵 MUSIC -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>❤️ A Special Question ❤️</h1>

        <p><strong>ANDREA DAMIAN, will you be mine forever? 💖</strong></p>

        <button class="yes" onclick="answerYes()">Yes 💕</button>
        <button class="no" id="noBtn">No 😢</button>

        <div id="result"></div>
    </div>
</div>

<script>
const correctPassword = "louise"; // 🔐 CHANGE THIS

function unlock(){
    const input = document.getElementById("password").value;

    if(input === correctPassword){
        document.getElementById("lockScreen").style.display="none";
        document.getElementById("mainPage").style.display="flex";

        // 🎵 PLAY MUSIC AFTER UNLOCK (required by browser)
        document.getElementById("bgMusic").play();
    } else {
        document.getElementById("error").innerText = "❌ Wrong password!";
    }
}

// YES
function answerYes(){
    document.getElementById("result").innerHTML =
    "💖 You said YES!! Forever starts now 💖";

    heartRain();
}

// NO RUNAWAY
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseenter", () => {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    noBtn.style.position = "fixed";
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
});

// HEART RAIN
function heartRain(){
    for(let i=0;i<60;i++){
        const heart = document.createElement("div");
        heart.className="falling-heart";
        heart.innerHTML="❤️";

        heart.style.left=Math.random()*window.innerWidth+"px";
        heart.style.fontSize=(Math.random()*20+20)+"px";
        heart.style.animationDuration=(Math.random()*3+2)+"s";

        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),5000);
    }
}
</script>

</body>
</html>
