<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Love Page ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* PASSWORD SCREEN */
#lockScreen{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

#lockScreen input{
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:10px;
    text-align:center;
}

#lockScreen button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#ff4d88;
    color:white;
    cursor:pointer;
}

/* MAIN PAGE */
body{
    overflow:hidden;
}

.main{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    padding:40px;
    border-radius:25px;
    text-align:center;
    color:white;
}

button{
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
}

.yes{
    background:#ff4d88;
    color:white;
}

.no{
    background:white;
    color:#ff4d88;
}

#result{
    margin-top:20px;
    font-size:1.5rem;
}

/* HEARTS */
.falling-heart{
    position:fixed;
    top:-50px;
    animation:fall linear forwards;
}

@keyframes fall{
    100%{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
    .player{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:500px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    border-radius:15px;
    padding:15px;
    color:white;
    font-size:14px;
}

.track-info{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.cover{
    width:45px;
    height:45px;
    background:#ff4d88;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    font-size:20px;
}

.controls{
    display:flex;
    align-items:center;
    gap:10px;
}

.controls button{
    background:#ff4d88;
    border:none;
    border-radius:50%;
    width:40px;
    height:40px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

#progress{
    flex:1;
}

.volume{
    margin-top:8px;
    font-size:12px;
}
</style>
</head>

<body>

<!-- 🔐 PASSWORD SCREEN -->
<div id="lockScreen">
    <h2>🔐 Enter Secret Password</h2>
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="unlock()">Enter 💖</button>
    <p id="error"></p>
</div>

<!-- 💖 MAIN CONTENT -->
<div class="main" id="mainPage">

    <!-- 🎵 MUSIC -->
    <audio id="bgMusic" loop>
       <!-- 🎵 SPOTIFY-STYLE PLAYER -->
<div class="player">
    <div class="track-info">
        <div class="cover">💖</div>
        <div>
            <div class="title">Love Theme</div>
            <div class="artist">For You Only</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="togglePlay()" id="playBtn">▶️</button>
        <input type="range" id="progress" value="0">
        <span id="time">0:00</span>
    </div>

    <div class="volume">
        🔊 <input type="range" id="volume" min="0" max="1" step="0.01" value="0.4">
    </div>

    <audio id="bgMusic">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
    </audio>
</div>
    </audio>

    <div class="container">
        <h1>❤️ A Special Question ❤️</h1>

        <p><strong>ANDREA DAMIAN, will you be mine forever? 💖</strong></p>

        <button class="yes" onclick="answerYes()">Yes 💕</button>
        <button class="no" id="noBtn">No 😢</button>

        <div id="result"></div>
    </div>
</div>

<script>
const correctPassword = "andrea"; // 🔐 CHANGE THIS

function unlock(){
    const input = document.getElementById("password").value;

    if(input === correctPassword){
        document.getElementById("lockScreen").style.display="none";
        document.getElementById("mainPage").style.display="flex";

        // 🎵 PLAY MUSIC AFTER UNLOCK (required by browser)
        document.getElementById("bgMusic").play();
    } else {
        document.getElementById("error").innerText = "❌ Wrong password!";
    }
}

// YES
function answerYes(){
    document.getElementById("result").innerHTML =
    "💖 You said YES!! Forever starts now 💖";

    heartRain();
}

// NO RUNAWAY
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseenter", () => {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    noBtn.style.position = "fixed";
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
});

// HEART RAIN
function heartRain(){
    for(let i=0;i<60;i++){
        const heart = document.createElement("div");
        heart.className="falling-heart";
        heart.innerHTML="❤️";

        heart.style.left=Math.random()*window.innerWidth+"px";
        heart.style.fontSize=(Math.random()*20+20)+"px";
        heart.style.animationDuration=(Math.random()*3+2)+"s";

        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),5000);
    }
}
    const audio = document.getElementById("bgMusic");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const time = document.getElementById("time");

// PLAY / PAUSE
function togglePlay(){
    if(audio.paused){
        audio.play();
        playBtn.innerHTML = "⏸️";
    } else {
        audio.pause();
        playBtn.innerHTML = "▶️";
    }
}

// UPDATE PROGRESS
audio.addEventListener("timeupdate", () => {
    progress.value = (audio.currentTime / audio.duration) * 100 || 0;

    let minutes = Math.floor(audio.currentTime / 60);
    let seconds = Math.floor(audio.currentTime % 60);
    if(seconds < 10) seconds = "0" + seconds;

    time.innerText = `${minutes}:${seconds}`;
});

// SEEK
progress.addEventListener("input", () => {
    audio.currentTime = (progress.value / 100) * audio.duration;
});

// VOLUME
volume.addEventListener("input", () => {
    audio.volume = volume.value;
});
</script>

</body>
</html>
